<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" style="background: #090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="glowPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        50% { transform: scale(1.18) translate(20px, -15px); opacity: 0.6; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes beamMove {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes tagPulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.6)); }
      }

      .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
      .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 1000px 300px; }
      .floating-node { animation: floatSlow 6s ease-in-out infinite; }
      .beam-line { stroke-dasharray: 20, 10; animation: beamMove 12s linear infinite; }
      .radar-arm { transform-origin: 1060px 100px; animation: radarSweep 14s linear infinite; }
      .tag-glow { animation: tagPulse 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- 1. Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- 2. Dynamic Ambient Lights in Background -->
  <circle class="orb-1" cx="220" cy="120" r="160" fill="#6366f1" filter="url(#glowPurple)" />
  <circle class="orb-2" cx="980" cy="280" r="180" fill="#0284c7" filter="url(#glowPurple)" />
  <circle cx="600" cy="380" r="140" fill="#0f766e" opacity="0.25" filter="url(#glowPurple)" />

  <!-- 3. Dynamic Circuit & Search Network Visuals (Background/Midground) -->
  <g opacity="0.45">
    <path class="beam-line" d="M 50 350 L 300 350 L 450 390 L 750 390 L 900 350 L 1150 350" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <path class="beam-line" d="M 120 70 L 320 70 L 420 30 L 780 30 L 880 70 L 1080 70" fill="none" stroke="#818cf8" stroke-width="1.5"/>
  </g>

  <!-- Radar / Semantic Scanner Indicator (Upper Right, completely behind text) -->
  <g opacity="0.35">
    <circle cx="1060" cy="100" r="60" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="1060" cy="100" r="40" fill="none" stroke="#818cf8" stroke-width="1"/>
    <circle cx="1060" cy="100" r="20" fill="none" stroke="#c084fc" stroke-width="1"/>
    <line class="radar-arm" x1="1060" y1="100" x2="1120" y2="100" stroke="#38bdf8" stroke-width="2" filter="url(#glowCyan)"/>
  </g>

  <!-- 4. Foreground Content Container (Guaranteed never covered) -->
  <g id="foreground-content">
    
    <!-- Top Category Badge Pill -->
    <g transform="translate(60, 48)">
      <rect width="365" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.95" class="tag-glow"/>
      <circle cx="18" cy="17" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="22" fill="#38bdf8" font-size="12.5" font-weight="700" letter-spacing="1.2">LEGALTECH &amp; ENTERPRISE SEARCH</text>
      <text x="272" y="22" fill="#94a3b8" font-size="12" font-weight="500">| MARCH 2026</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="132" fill="url(#textGrad)" font-size="44" font-weight="900" letter-spacing="-0.8">
      Awesome Contract Semantic Search
    </text>

    <!-- Subtitle (Clear, crisp, high contrast) -->
    <text x="60" y="174" fill="#f8fafc" font-size="20" font-weight="600" letter-spacing="-0.2">
      Natural Language Querying, Vector Retrieval &amp; AI Contract Intelligence
    </text>

    <!-- Value Prop Description -->
    <text x="60" y="210" fill="#94a3b8" font-size="14.5" font-weight="400">
      Query MSAs, clauses, covenants, and legal obligations using conversational plain English.
    </text>

    <!-- Floating Interactive Feature Badges (Pills) -->
    <g class="floating-node" transform="translate(60, 246)">
      <!-- Pill 1: Hybrid Retrieval -->
      <g transform="translate(0, 0)">
        <rect width="185" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <text x="18" y="26" fill="#38bdf8" font-size="15">🔍</text>
        <text x="44" y="26" fill="#e2e8f0" font-size="13" font-weight="600">Hybrid BM25 + Vector</text>
      </g>

      <!-- Pill 2: Legal Clause Grounding -->
      <g transform="translate(200, 0)">
        <rect width="195" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <text x="18" y="26" fill="#a855f7" font-size="15">📜</text>
        <text x="44" y="26" fill="#e2e8f0" font-size="13" font-weight="600">Clause &amp; Precedent RAG</text>
      </g>

      <!-- Pill 3: Sovereign & Open Source -->
      <g transform="translate(410, 0)">
        <rect width="190" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <text x="18" y="26" fill="#10b981" font-size="15">🛡️</text>
        <text x="44" y="26" fill="#e2e8f0" font-size="13" font-weight="600">Sovereign On-Prem</text>
      </g>

      <!-- Pill 4: Enterprise RBAC -->
      <g transform="translate(615, 0)">
        <rect width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <text x="18" y="26" fill="#f59e0b" font-size="15">🔐</text>
        <text x="44" y="26" fill="#e2e8f0" font-size="13" font-weight="600">Index-Level RBAC</text>
      </g>

      <!-- Pill 5: Market Intelligence -->
      <g transform="translate(810, 0)">
        <rect width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <text x="18" y="26" fill="#ec4899" font-size="15">📊</text>
        <text x="44" y="26" fill="#e2e8f0" font-size="13" font-weight="600">SaaS &amp; OSS Matrix</text>
      </g>
    </g>

    <!-- Bottom Metrics Banner Bar -->
    <g transform="translate(60, 318)">
      <rect width="1080" height="66" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      
      <!-- Metric 1 -->
      <text x="45" y="38" fill="#38bdf8" font-size="20" font-weight="800">10+</text>
      <text x="90" y="38" fill="#cbd5e1" font-size="13.5" font-weight="500">Enterprise SaaS Evaluated</text>
      <line x1="320" y1="18" x2="320" y2="48" stroke="#334155" stroke-width="1"/>

      <!-- Metric 2 -->
      <text x="355" y="38" fill="#818cf8" font-size="20" font-weight="800">9+</text>
      <text x="388" y="38" fill="#cbd5e1" font-size="13.5" font-weight="500">Open-Source Engines &amp; Vector DBs</text>
      <line x1="720" y1="18" x2="720" y2="48" stroke="#334155" stroke-width="1"/>

      <!-- Metric 3 -->
      <text x="755" y="38" fill="#10b981" font-size="18" font-weight="800">100%</text>
      <text x="815" y="38" fill="#cbd5e1" font-size="13.5" font-weight="500">Free Tier &amp; Pricing Transparency</text>
    </g>
  </g>
</svg>
